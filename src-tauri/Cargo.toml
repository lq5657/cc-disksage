[package]
name = "cc-disksage"
version = "0.1.0"
description = "Offline-first Windows disk cleanup with evidence chain"
authors = ["CC DiskSage"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_disksage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
disksage-core = { path = "../crates/disksage-core" }
disksage-scan = { path = "../crates/disksage-scan" }
disksage-rules = { path = "../crates/disksage-rules" }
disksage-clean = { path = "../crates/disksage-clean" }
disksage-llm = { path = "../crates/disksage-llm" }
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid.workspace = true
chrono.workspace = true


# Release profile is defined at the workspace root.
