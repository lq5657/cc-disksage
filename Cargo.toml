[workspace]
resolver = "3"
members = [
    "crates/disksage-core",
    "crates/disksage-scan",
    "crates/disksage-rules",
    "crates/disksage-clean",
    "crates/disksage-llm",
    "crates/disksage-helper",
    "src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
