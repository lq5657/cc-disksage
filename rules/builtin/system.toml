schema_version = 1

[[rules]]
id = "system.user_temp"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_temp"
title_zh = "用户临时文件"
title_en = "User temp files"
risk = "safe"
requires_admin = false
default_selected = true
recoverability = "regenerable"
min_age_days = 1
detect = { path_exists_any = ["%TEMP%"] }
targets = [
  { root = "%TEMP%", include_globs = ["**/*"], exclude_globs = ["**/*.lock", "**/*.tmp.lock", "**/~$*"], max_depth = 32 }
]
explain = { what_zh = "应用程序产生的临时文件，正常关闭后通常不再需要。", what_en = "Temporary files created by applications; normally no longer needed after the app closes.", impact_zh = "正在被占用的文件会被跳过；部分程序可能需要重新生成临时数据。", impact_en = "Files in use are skipped; some applications may regenerate temporary data.", exclude_notes_zh = "不会删除文档、桌面、下载目录或浏览器数据。", exclude_notes_en = "Documents, Desktop, Downloads, and browser data are never touched.", source = "Microsoft Windows TEMP convention" }
action = { type = "trash" }

[[rules]]
id = "system.thumbnails"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_cache"
title_zh = "缩略图与图标缓存"
title_en = "Thumbnail and icon cache"
risk = "safe"
requires_admin = false
default_selected = true
recoverability = "regenerable"
min_age_days = 0
detect = { path_exists_any = ["%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer"] }
targets = [
  { root = "%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer", include_globs = ["thumbcache_*.db", "iconcache_*.db"], exclude_globs = [], max_depth = 1 }
]
explain = { what_zh = "Windows 资源管理器生成的缩略图和图标缓存。", what_en = "Thumbnail and icon cache generated by Windows Explorer.", impact_zh = "删除后资源管理器会按需重建；正在被占用时会被跳过。", impact_en = "Explorer rebuilds them on demand; locked files are skipped.", exclude_notes_zh = "不涉及任何用户文件。", exclude_notes_en = "No user files are involved.", source = "Windows Explorer cache layout" }
action = { type = "trash" }

[[rules]]
id = "system.shader_cache"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_cache"
title_zh = "GPU 着色器缓存"
title_en = "GPU shader cache"
risk = "safe"
requires_admin = false
default_selected = true
recoverability = "regenerable"
min_age_days = 0
detect = { path_exists_any = ["%LOCALAPPDATA%\\D3DSCache", "%LOCALAPPDATA%\\NVIDIA\\DXCache", "%LOCALAPPDATA%\\AMD\\DxCache"] }
targets = [
  { root = "%LOCALAPPDATA%\\D3DSCache", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 },
  { root = "%LOCALAPPDATA%\\NVIDIA\\DXCache", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 },
  { root = "%LOCALAPPDATA%\\AMD\\DxCache", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 }
]
explain = { what_zh = "显卡驱动生成的着色器编译缓存。", what_en = "Shader compilation cache generated by GPU drivers.", impact_zh = "删除后游戏或图形程序首次启动会重新编译，可能略慢。", impact_en = "Games or graphics apps recompile on first launch; they may start slightly slower.", exclude_notes_zh = "不涉及游戏存档或用户数据。", exclude_notes_en = "Game saves and user data are never touched.", source = "DirectX / NVIDIA / AMD cache locations" }
action = { type = "trash" }

[[rules]]
id = "system.windows_temp"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_temp"
title_zh = "Windows 临时文件"
title_en = "Windows temp files"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 1
detect = { path_exists_any = ["%WINDIR%\\Temp"] }
targets = [
  { root = "%WINDIR%\\Temp", include_globs = ["**/*"], exclude_globs = ["**/*.lock"], max_depth = 32 }
]
explain = { what_zh = "系统级临时文件；部分安装程序在运行时会使用该目录。", what_en = "System-level temporary files; some installers use this directory while running.", impact_zh = "正在使用的文件会被跳过；需要管理员权限。", impact_en = "Files in use are skipped; administrator rights are required.", exclude_notes_zh = "不删除系统目录本身或任何注册表内容。", exclude_notes_en = "The directory itself and the registry are never touched.", source = "Microsoft Windows WINDIR\\Temp convention" }
action = { type = "trash" }

[[rules]]
id = "system.wer_user"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_logs"
title_zh = "Windows 错误报告"
title_en = "Windows Error Reporting"
risk = "caution"
requires_admin = false
default_selected = false
recoverability = "regenerable"
min_age_days = 7
detect = { path_exists_any = ["%LOCALAPPDATA%\\Microsoft\\Windows\\WER"] }
targets = [
  { root = "%LOCALAPPDATA%\\Microsoft\\Windows\\WER\\ReportArchive", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 },
  { root = "%LOCALAPPDATA%\\Microsoft\\Windows\\WER\\ReportQueue", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 }
]
explain = { what_zh = "Windows 错误报告的归档与队列文件。", what_en = "Windows Error Reporting archive and queue files.", impact_zh = "不会再保留这些历史崩溃报告，便于诊断的信息会丢失。", impact_en = "Historical crash reports are removed; diagnostic information may be lost.", exclude_notes_zh = "不影响系统稳定性。", exclude_notes_en = "System stability is not affected.", source = "Windows WER default layout" }
action = { type = "trash" }

[[rules]]
id = "system.crash_dumps_user"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_logs"
title_zh = "用户崩溃转储"
title_en = "User crash dumps"
risk = "caution"
requires_admin = false
default_selected = false
recoverability = "regenerable"
min_age_days = 30
detect = { path_exists_any = ["%LOCALAPPDATA%\\CrashDumps"] }
targets = [
  { root = "%LOCALAPPDATA%\\CrashDumps", include_globs = ["**/*"], exclude_globs = [], max_depth = 4 }
]
explain = { what_zh = "应用程序崩溃时生成的转储文件。", what_en = "Dump files generated when applications crash.", impact_zh = "删除后无法再对这些历史崩溃做离线分析。", impact_en = "Historical crashes can no longer be analyzed offline.", exclude_notes_zh = "不影响正在运行的程序。", exclude_notes_en = "Running applications are not affected.", source = "Windows CrashDumps default layout" }
action = { type = "trash" }
