schema_version = 1

[[rules]]
id = "apps.vscode_cache"
version = 1
verified_at = "2026-10-18"
verified_on = "VS Code 1.10x"
category = "apps"
title_zh = "VS Code 缓存"
title_en = "VS Code cache"
risk = "safe"
requires_admin = false
default_selected = true
recoverability = "regenerable"
min_age_days = 0
detect = { path_exists_any = ["%APPDATA%\\Code"] }
targets = [
  { root = "%APPDATA%\\Code", include_globs = ["Cache/**", "CachedData/**", "GPUCache/**", "logs/**"], exclude_globs = ["**/User/**", "**/Backups/**", "**/workspaceStorage/**", "**/globalStorage/**"], max_depth = 4 }
]
explain = { what_zh = "VS Code 的缓存、编译缓存与日志。", what_en = "VS Code caches, compiled data, and logs.", impact_zh = "删除后 VS Code 首次启动或打开项目可能略慢；设置、扩展与工作区数据不受影响。", impact_en = "VS Code may start or open projects slightly slower; settings, extensions, and workspace data are untouched.", exclude_notes_zh = "硬排除用户设置、备份、workspaceStorage 与 globalStorage。", exclude_notes_en = "User settings, backups, workspaceStorage, and globalStorage are hard-excluded.", source = "VS Code user-data cache layout" }
action = { type = "trash" }

