[[rules]]
id = "system.windows_system_temp"
version = 1
verified_at = "2026-10-19"
verified_on = "Windows 11 26200"
category = "system_temp"
title_zh = "Windows 系统临时目录"
title_en = "Windows system temp directory"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 1
detect = { path_exists_any = ["%WINDIR%\\SystemTemp"] }
targets = [
  { root = "%WINDIR%\\SystemTemp", include_globs = ["**/*"], exclude_globs = ["**/*.lock"], max_depth = 8 }
]
explain = { what_zh = "Windows 系统组件使用的临时文件目录。", what_en = "Temporary files used by Windows system components.", impact_zh = "正在使用的文件会被跳过；部分组件可能需要重新生成临时数据。", impact_en = "Files in use are skipped; some components may regenerate temporary data.", exclude_notes_zh = "不删除目录本身，不触碰 System32/WinSxS。", exclude_notes_en = "The directory itself is preserved; System32 and WinSxS are never touched.", source = "Windows SystemTemp layout" }
