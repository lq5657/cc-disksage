schema_version = 1

[[rules]]
id = "system.wer_machine"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_logs"
title_zh = "Windows 错误报告（机器级）"
title_en = "Windows Error Reporting (machine)"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 7
detect = { path_exists_any = ["%PROGRAMDATA%\\Microsoft\\Windows\\WER"] }
targets = [
  { root = "%PROGRAMDATA%\\Microsoft\\Windows\\WER\\ReportArchive", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 },
  { root = "%PROGRAMDATA%\\Microsoft\\Windows\\WER\\ReportQueue", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 }
]
explain = { what_zh = "机器级 Windows 错误报告归档与队列。", what_en = "Machine-wide Windows Error Reporting archives and queues.", impact_zh = "历史崩溃报告会被删除；需要管理员权限。", impact_en = "Historical crash reports are removed; administrator rights are required.", exclude_notes_zh = "不影响正在运行的程序。", exclude_notes_en = "Running applications are not affected.", source = "Windows WER machine layout" }
action = { type = "trash" }

[[rules]]
id = "system.minidump"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_logs"
title_zh = "系统小型转储"
title_en = "System minidumps"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 30
detect = { path_exists_any = ["%WINDIR%\\Minidump"] }
targets = [
  { root = "%WINDIR%\\Minidump", include_globs = ["**/*"], exclude_globs = [], max_depth = 4 }
]
explain = { what_zh = "系统蓝屏或崩溃时生成的小型转储文件。", what_en = "Minidump files generated by system crashes.", impact_zh = "删除后无法再对历史蓝屏做离线分析；需要管理员权限。", impact_en = "Historical crash dumps can no longer be analyzed; administrator rights are required.", exclude_notes_zh = "不影响系统启动。", exclude_notes_en = "System boot is not affected.", source = "Windows Minidump layout" }
action = { type = "trash" }

[[rules]]
id = "system.delivery_optimization"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "windows_update"
title_zh = "传递优化缓存"
title_en = "Delivery Optimization cache"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 0
detect = { path_exists_any = ["%WINDIR%\\ServiceProfiles\\NetworkService\\AppData\\Local\\Microsoft\\Windows\\DeliveryOptimization\\Cache"] }
targets = [
  { root = "%WINDIR%\\ServiceProfiles\\NetworkService\\AppData\\Local\\Microsoft\\Windows\\DeliveryOptimization\\Cache", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 }
]
explain = { what_zh = "Windows 更新使用的传递优化下载缓存。", what_en = "Delivery Optimization download cache used by Windows Update.", impact_zh = "停止 dosvc 服务后清理缓存，再恢复服务；更新内容会按需重新下载。", impact_en = "The dosvc service is stopped, the cache is cleared, and the service is restored; updates are re-downloaded on demand.", exclude_notes_zh = "不删除已安装的更新。", exclude_notes_en = "Installed updates are not removed.", source = "Windows Delivery Optimization cache path" }
action = { type = "service_cleanup", services = ["dosvc"], paths = ["%WINDIR%\\ServiceProfiles\\NetworkService\\AppData\\Local\\Microsoft\\Windows\\DeliveryOptimization\\Cache"] }

[[rules]]
id = "system.wu_download"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "windows_update"
title_zh = "Windows 更新下载缓存"
title_en = "Windows Update download cache"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 0
detect = { path_exists_any = ["%WINDIR%\\SoftwareDistribution\\Download"] }
targets = [
  { root = "%WINDIR%\\SoftwareDistribution\\Download", include_globs = ["**/*"], exclude_globs = [], max_depth = 16 }
]
explain = { what_zh = "Windows 更新已下载但尚未安装的安装包缓存。", what_en = "Downloaded Windows Update packages that are not yet installed.", impact_zh = "停止 wuauserv/bits/dosvc 后清理，再恢复原本运行的服务；更新会重新下载。", impact_en = "wuauserv/bits/dosvc are stopped, the cache is cleared, and previously running services are restored; updates are downloaded again.", exclude_notes_zh = "不删除已安装更新，不使用 /ResetBase。", exclude_notes_en = "Installed updates are not removed and /ResetBase is never used.", source = "Windows SoftwareDistribution layout" }
action = { type = "service_cleanup", services = ["wuauserv", "bits", "dosvc"], paths = ["%WINDIR%\\SoftwareDistribution\\Download"] }

[[rules]]
id = "system.dism_analyze"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "windows_component"
title_zh = "组件存储分析"
title_en = "Component store analysis"
risk = "safe"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 0
detect = { path_exists_any = ["%WINDIR%\\Logs"] }
targets = [
  { root = "%WINDIR%\\Logs", include_globs = ["__disksage_never_match__"], exclude_globs = [], max_depth = 1 }
]
explain = { what_zh = "运行 DISM AnalyzeComponentStore 做只读分析，显示组件存储可回收量；不删除任何内容。", what_en = "Runs DISM AnalyzeComponentStore as a read-only analysis; nothing is deleted.", impact_zh = "只读操作，不修改系统。", impact_en = "Read-only; no system changes.", exclude_notes_zh = "不执行 StartComponentCleanup 或 /ResetBase。", exclude_notes_en = "Does not run StartComponentCleanup or /ResetBase.", source = "Microsoft DISM AnalyzeComponentStore" }
action = { type = "dism_analyze" }

[[rules]]
id = "system.dism_cleanup"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "windows_component"
title_zh = "组件存储清理"
title_en = "Component store cleanup"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "irreversible"
min_age_days = 0
detect = { path_exists_any = ["%WINDIR%\\Logs"] }
targets = [
  { root = "%WINDIR%\\Logs", include_globs = ["__disksage_never_match__"], exclude_globs = [], max_depth = 1 }
]
explain = { what_zh = "运行 DISM StartComponentCleanup 删除被取代的组件；不使用 /ResetBase。", what_en = "Runs DISM StartComponentCleanup to remove superseded components; /ResetBase is never used.", impact_zh = "清理后无法卸载部分旧更新；可能需要重启。", impact_en = "Some older updates can no longer be uninstalled; a reboot may be required.", exclude_notes_zh = "不触碰 WinSxS 目录本身，不删除当前组件。", exclude_notes_en = "Does not touch the WinSxS directory manually and does not remove current components.", source = "Microsoft DISM StartComponentCleanup" }
action = { type = "dism_start_component_cleanup" }

[[rules]]
id = "system.hibernation"
version = 1
verified_at = "2026-10-18"
verified_on = "Windows 11 26200"
category = "system_power"
title_zh = "关闭休眠文件"
title_en = "Disable hibernation file"
risk = "danger"
requires_admin = true
default_selected = false
recoverability = "irreversible"
min_age_days = 0
detect = { path_exists_any = ["%SYSTEMDRIVE%\\hiberfil.sys"] }
targets = [
  { root = "%WINDIR%\\Logs", include_globs = ["__disksage_never_match__"], exclude_globs = [], max_depth = 1 }
]
explain = { what_zh = "执行 powercfg /hibernate off，删除 hiberfil.sys 并关闭休眠/快速启动。", what_en = "Runs powercfg /hibernate off, removes hiberfil.sys, and disables hibernation/fast startup.", impact_zh = "休眠和快速启动将不可用；可随时用 powercfg /hibernate on 恢复。", impact_en = "Hibernation and fast startup are disabled; they can be restored with powercfg /hibernate on.", exclude_notes_zh = "不修改分页文件。", exclude_notes_en = "The page file is not modified.", source = "Microsoft powercfg" }
action = { type = "hibernate_off" }

[[rules]]
id = "system.servicing_logs"
version = 1
verified_at = "2026-10-19"
verified_on = "Windows 11 26200"
category = "system_logs"
title_zh = "Windows 维护与更新日志"
title_en = "Windows servicing and update logs"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "recycle_bin"
min_age_days = 3
detect = { path_exists_any = ["%WINDIR%\\Logs\\CBS", "%WINDIR%\\Logs\\DISM", "%WINDIR%\\Logs\\WindowsUpdate", "%WINDIR%\\Logs\\MoSetup", "%WINDIR%\\Logs\\SIH", "%WINDIR%\\Logs\\waasmedic", "%WINDIR%\\Logs\\waasmediccapsule", "%WINDIR%\\Logs\\PITR", "%WINDIR%\\Logs\\NetSetup", "%WINDIR%\\Logs\\WinREAgent", "%WINDIR%\\Logs\\SetupRecoveryDataTask", "%PROGRAMDATA%\\USOShared\\Logs"] }
targets = [
  { root = "%WINDIR%\\Logs\\CBS", include_globs = ["CbsPersist_*.log", "*.cab"], exclude_globs = ["CBS.log"], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\DISM", include_globs = ["*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\WindowsUpdate", include_globs = ["*.etl", "*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\MoSetup", include_globs = ["*.log", "*.etl"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\SIH", include_globs = ["*.etl", "*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\waasmedic", include_globs = ["*.etl", "*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\waasmediccapsule", include_globs = ["*.etl", "*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\PITR", include_globs = ["*.log", "*.etl"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\NetSetup", include_globs = ["*.etl", "*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\WinREAgent", include_globs = ["*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%WINDIR%\\Logs\\SetupRecoveryDataTask", include_globs = ["*.log"], exclude_globs = [], max_depth = 1 },
  { root = "%PROGRAMDATA%\\USOShared\\Logs", include_globs = ["**/*.etl"], exclude_globs = [], max_depth = 2 }
]
explain = { what_zh = "Windows 组件安装、DISM、Windows 更新、更新协调器、恢复与维护日志。", what_en = "Windows component installation, DISM, Windows Update, Update Orchestrator, recovery, and servicing logs.", impact_zh = "删除后历史诊断信息会丢失；不影响系统更新、启动或已安装更新。正在使用的日志会被跳过。", impact_en = "Historical diagnostic information is lost; system updates, boot, and installed updates are unaffected. Logs in use are skipped.", exclude_notes_zh = "不删除 CBS.log、不触碰 WinSxS、MeasuredBoot、SystemRestore、USOPrivate\\UpdateStore 或已安装更新。", exclude_notes_en = "CBS.log, WinSxS, MeasuredBoot, SystemRestore, USOPrivate\\UpdateStore, and installed updates are never touched.", source = "Windows Logs CBS/DISM/WindowsUpdate/MoSetup/SIH/waasmedic/waasmediccapsule/PITR/NetSetup/WinREAgent/SetupRecoveryDataTask and USOShared\\Logs layouts" }
action = { type = "trash" }

[[rules]]
id = "system.prefetch"
version = 1
verified_at = "2026-10-19"
verified_on = "Windows 11 26200"
category = "system_cache"
title_zh = "Prefetch 预读取文件"
title_en = "Prefetch files"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "regenerable"
min_age_days = 7
detect = { path_exists_any = ["%WINDIR%\\Prefetch"] }
targets = [
  { root = "%WINDIR%\\Prefetch", include_globs = ["*.pf"], exclude_globs = ["layout.ini"], max_depth = 1 }
]
explain = { what_zh = "Windows 用于加速程序启动的预读取文件。", what_en = "Prefetch files used by Windows to speed up application startup.", impact_zh = "删除后程序首次启动可能略慢，Windows 会按需重建。", impact_en = "Applications may start slightly slower the first time; Windows rebuilds the files on demand.", exclude_notes_zh = "只匹配 *.pf，不删除 layout.ini 或其他文件。", exclude_notes_en = "Only *.pf files are matched; layout.ini and other files are not touched.", source = "Windows Prefetch layout" }
action = { type = "trash" }

[[rules]]
id = "system.panther_logs"
version = 1
verified_at = "2026-10-19"
verified_on = "Windows 11 26200"
category = "system_logs"
title_zh = "Windows 安装日志（Panther）"
title_en = "Windows setup logs (Panther)"
risk = "caution"
requires_admin = true
default_selected = false
recoverability = "recycle_bin"
min_age_days = 7
detect = { path_exists_any = ["%WINDIR%\\Panther"] }
targets = [
  { root = "%WINDIR%\\Panther", include_globs = ["**/*.log", "**/*.etl", "**/*.dmp"], exclude_globs = ["**/*.xml", "**/*.txt", "**/*.ini"], max_depth = 4 }
]
explain = { what_zh = "Windows 安装与升级过程生成的日志和转储。", what_en = "Logs and dumps generated during Windows setup and upgrade.", impact_zh = "删除后无法再分析历史安装/升级问题；不影响当前系统启动。", impact_en = "Historical setup/upgrade diagnostics can no longer be analyzed; the current system boot is unaffected.", exclude_notes_zh = "只匹配日志、ETL 与转储，不删除 XML/TXT/INI 配置文件。", exclude_notes_en = "Only logs, ETL, and dumps are matched; XML/TXT/INI configuration files are not touched.", source = "Windows Panther setup log layout" }
action = { type = "trash" }

