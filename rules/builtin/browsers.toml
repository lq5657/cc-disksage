]
explain = { what_zh = "Edge 的 GPU、Dawn 与着色器编译缓存。", what_en = "GPU, Dawn, and shader compilation caches for Edge.", impact_zh = "删除后网页或 WebGPU 应用首次渲染可能略慢；登录状态与书签不受影响。", impact_en = "The first render of web pages or WebGPU apps may be slightly slower; sign-in state and bookmarks are unaffected.", exclude_notes_zh = "硬排除 Cookie、登录数据、历史、书签、Local Storage 与 Service Worker。", exclude_notes_en = "Cookies, login data, history, bookmarks, Local Storage, and Service Worker are hard-excluded.", source = "Chromium Edge User Data shader/GPU cache layout" }
