schema_version = 1

[[rules]]
id = "dev.npm_cache"
version = 1
verified_at = "2026-10-18"
verified_on = "npm 11"
category = "developer"
title_zh = "npm 缓存"
title_en = "npm cache"
risk = "safe"
requires_admin = false
default_selected = true
recoverability = "regenerable"
min_age_days = 7
detect = { path_exists_any = ["%LOCALAPPDATA%\\npm-cache"] }
targets = [
  { root = "%LOCALAPPDATA%\\npm-cache", include_globs = ["**/*"], exclude_globs = [], max_depth = 32 }
]
explain = { what_zh = "npm 下载的包缓存。", what_en = "Package cache downloaded by npm.", impact_zh = "删除后安装依赖会重新下载，首次安装会变慢。", impact_en = "Dependencies are downloaded again; the next install may be slower.", exclude_notes_zh = "不涉及项目源码或 node_modules。", exclude_notes_en = "Project source and node_modules are not touched.", source = "npm default cache location" }
action = { type = "trash" }

